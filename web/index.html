<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이키우기 — 미리보기</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2E2A26;
        font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      }
      /*
        세로 고정 기기 크기로 가둔다. 브라우저 창 크기로 보면 레이아웃 판단이 어긋난다.
        react-native-web의 flex:1은 부모가 flex 컨테이너이고 높이가 정해져야 먹는다.
      */
      #root {
        width: 390px;
        height: 844px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
